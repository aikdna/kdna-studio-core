name: CI
on: [pull_request, push]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.1', '24.18.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check out the exact Core candidate outside the Studio workspace
        env:
          KDNA_CORE_CANDIDATE_REPOSITORY: aikdna/kdna
          KDNA_CORE_CANDIDATE_COMMIT: 32aa3ff8e633291d4bb9e01de5a70181c8415d93
        run: |
          set -euo pipefail
          runner_temp="$(realpath "$RUNNER_TEMP")"
          workspace="$(realpath "$GITHUB_WORKSPACE")"
          candidate_source="$runner_temp/kdna-core-candidate"
          test ! -e "$candidate_source"
          git init --quiet "$candidate_source"
          git -C "$candidate_source" remote add origin \
            "https://github.com/$KDNA_CORE_CANDIDATE_REPOSITORY.git"
          git -C "$candidate_source" fetch --quiet --no-tags --depth=1 origin \
            "$KDNA_CORE_CANDIDATE_COMMIT"
          git -C "$candidate_source" checkout --quiet --detach \
            "$KDNA_CORE_CANDIDATE_COMMIT"
          test "$(git -C "$candidate_source" rev-parse HEAD)" = \
            "$KDNA_CORE_CANDIDATE_COMMIT"
          candidate_source="$(realpath "$candidate_source")"
          case "$candidate_source" in
            "$runner_temp"/*) ;;
            *) exit 1 ;;
          esac
          case "$candidate_source" in
            "$workspace"/*) exit 1 ;;
          esac
          echo "KDNA_CORE_CANDIDATE_SOURCE=$candidate_source" >> "$GITHUB_ENV"
      - name: Set up the trusted npm host
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.1
          check-latest: false
      - run: node --version | grep -Fx "$(printf 'v%s' '22.23.1')"
      - name: Acquire and verify the audited npm release bytes
        run: |
          node scripts/acquire-trusted-npm-release.js --out "$RUNNER_TEMP/npm-11.17.0.tgz"
          echo "KDNA_TRUSTED_NPM_TARBALL=$RUNNER_TEMP/npm-11.17.0.tgz" >> "$GITHUB_ENV"
      # --omit=optional keeps the installed graph equal to the audited graph:
      # the component runtime refuses unbound optional addons
      # (src/creation-engine/component-runtime-binding.js) and the vendored lock
      # resolves every non-optional package to file:vendor/*.tgz.
      - run: node scripts/run-trusted-npm.js ci --ignore-scripts --omit=optional --no-audit --no-fund --registry=https://registry.npmjs.org/ --@aikdna:registry=https://registry.npmjs.org/
      - name: Reproduce both checked candidate artifacts from their exact clean sources (gated legacy candidate leg)
        run: node scripts/ci-leg-receipt.js candidate-sources
      - name: Set up the tested Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          check-latest: false
      - run: node --version | grep -Fx "$(printf 'v%s' '${{ matrix.node }}')"
      - name: Run the complete suite on the audited npm runtime
        run: node scripts/run-test-all.js
      - name: Verify the historical-to-maintained package migration from the public registry
        run: node scripts/verify-registry-migration.js
  identity-focused:
    # The identity directory transaction uses platform-sensitive primitives
    # (directory rename semantics, directory fsync, SIGKILL from a watcher
    # thread), so prove it on macOS and Windows too, not only on Ubuntu.
    # Only the identity suites run here to keep the job short; the module is
    # dependency-free, so no install step is needed.
    name: Identity transaction tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up the tested Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.1
          check-latest: false
      - name: Run the identity suites
        run: node --test tests/creator-identity.test.js tests/creator-identity-envelope.test.js
