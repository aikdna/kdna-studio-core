name: Publish to npm

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.action == 'published' &&
      github.event.release.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_EVENT_ACTION: ${{ github.event.action }}
      RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
      RELEASE_IS_DRAFT: ${{ github.event.release.draft }}
      RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.1
          check-latest: false
          registry-url: 'https://registry.npmjs.org'
      - run: node --version | grep -Fx "$(printf 'v%s' '22.23.1')"
      - name: Check out the exact Runtime source outside the Studio workspace
        env:
          KDNA_CORE_CANDIDATE_REPOSITORY: aikdna/kdna
        run: |
          set -euo pipefail
          KDNA_CORE_CANDIDATE_COMMIT="$(node -p 'require("./fixtures/runtime-candidates/current-sources.json").packages.find(p => p.name === "@aikdna/kdna-core").commit')"
          runner_temp="$(realpath "$RUNNER_TEMP")"
          workspace="$(realpath "$GITHUB_WORKSPACE")"
          candidate_source="$runner_temp/kdna-core-candidate"
          test ! -e "$candidate_source"
          git init --quiet "$candidate_source"
          git -C "$candidate_source" remote add origin \
            "https://github.com/$KDNA_CORE_CANDIDATE_REPOSITORY.git"
          git -C "$candidate_source" fetch --quiet --no-tags --depth=1 origin \
            "$KDNA_CORE_CANDIDATE_COMMIT"
          git -C "$candidate_source" checkout --quiet --detach \
            "$KDNA_CORE_CANDIDATE_COMMIT"
          test "$(git -C "$candidate_source" rev-parse HEAD)" = \
            "$KDNA_CORE_CANDIDATE_COMMIT"
          candidate_source="$(realpath "$candidate_source")"
          case "$candidate_source" in
            "$runner_temp"/*) ;;
            *) exit 1 ;;
          esac
          case "$candidate_source" in
            "$workspace"/*) exit 1 ;;
          esac
          echo "KDNA_CORE_CANDIDATE_SOURCE=$candidate_source" >> "$GITHUB_ENV"
      - name: Acquire and verify the audited npm release bytes
        run: |
          node scripts/acquire-trusted-npm-release.js --out "$RUNNER_TEMP/npm-11.17.0.tgz"
          echo "KDNA_TRUSTED_NPM_TARBALL=$RUNNER_TEMP/npm-11.17.0.tgz" >> "$GITHUB_ENV"
      - run: node scripts/run-trusted-npm.js ci --ignore-scripts --omit=optional --no-audit --no-fund --registry=https://registry.npmjs.org/ --@aikdna:registry=https://registry.npmjs.org/
      - name: Reproduce both checked Runtime artifacts from their exact sources
        run: node scripts/ci-leg-receipt.js candidate-sources
      # The tag checkout may not carry origin/main. Fetch it explicitly; the
      # release gate refuses by name if the ref is missing or unreadable.
      - name: Fetch origin/main for the release ancestry gate
        run: node scripts/fetch-release-main.js
      - name: Verify release event, tag, commit, package, and changelog
        run: node scripts/run-trusted-npm.js run release:check
      - name: Run the complete release test suite
        run: node scripts/run-trusted-npm.js run test:all
      - name: Build independently verified pack evidence
        run: >-
          node scripts/run-trusted-npm.js run
          ${{ github.event.release.prerelease && 'candidate:generate-evidence' || 'release:generate-evidence' }} --
          --out "$RUNNER_TEMP/kdna-studio-core-release-evidence.json"
          --artifact "$RUNNER_TEMP/kdna-studio-core-release.tgz"
      - name: Publish or idempotently skip the verified package
        run: >-
          node ${{ github.event.release.prerelease && 'scripts/publish-candidate-artifact.js' || 'scripts/publish-verified-artifact.js' }}
          --evidence "$RUNNER_TEMP/kdna-studio-core-release-evidence.json"
          --artifact "$RUNNER_TEMP/kdna-studio-core-release.tgz"
          --tag ${{ github.event.release.prerelease && 'components-preview' || 'latest' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Remove transient release artifacts
        if: always()
        run: >-
          rm -f
          "$RUNNER_TEMP/kdna-studio-core-release-evidence.json"
          "$RUNNER_TEMP/kdna-studio-core-release.tgz"
